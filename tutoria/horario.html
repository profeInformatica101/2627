<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Horario semanal de 3.º A con materias, aulas y códigos docentes.">
  <meta name="theme-color" content="#17233f">
  <title>Horario semanal · 3.º A</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317233f'/%3E%3Cpath d='M17 14v8M47 14v8M13 25h38M16 18h32a4 4 0 014 4v28H12V22a4 4 0 014-4z' fill='none' stroke='%23f6c453' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #17233f;
      --muted: #667085;
      --paper: #f4f6fb;
      --white: #fff;
      --line: #dde3ed;
      --accent: #f6c453;
      --blue: #3155d9;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 5% 8%, rgba(49, 85, 217, .11), transparent 25rem),
        radial-gradient(circle at 96% 95%, rgba(246, 196, 83, .17), transparent 24rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(1580px, calc(100% - 10px));
      margin: 6px auto;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
    }

    .eyebrow {
      display: none;
      margin: 0;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 850;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.8vw, 2.2rem);
      line-height: 1;
      letter-spacing: -.045em;
    }

    h1 span { color: var(--blue); }

    .actions { display: flex; gap: 5px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 35px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: rgba(255,255,255,.88);
      cursor: pointer;
      font-weight: 800;
    }

    .button.primary { border-color: var(--ink); color: white; background: var(--ink); }
    .button.icon { width: 37px; padding: 0; font-size: 1.15rem; }
    .button:hover { transform: translateY(-1px); }
    .button:focus-visible, .lesson:focus-visible, .close:focus-visible {
      outline: 3px solid rgba(49,85,217,.32);
      outline-offset: 2px;
    }

    .guide {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 31px;
      margin-bottom: 4px;
      padding: 4px 8px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.76);
      color: #4c5870;
      font-size: .73rem;
      white-space: nowrap;
    }

    .key { display: inline-flex; align-items: center; gap: 6px; font-weight: 750; }
    .dot { width: 9px; height: 9px; border-radius: 3px; }
    .dot.subject { background: var(--blue); }
    .dot.room { background: #0f9f8c; }
    .dot.teacher { background: #d97706; }
    .guide-note { margin-left: auto; }

    .table-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      box-shadow: 0 18px 48px rgba(23,35,63,.12);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    tr > :last-child { border-right: 0; }
    tbody tr:last-child > * { border-bottom: 0; }

    thead th {
      height: 40px;
      padding: 5px;
      color: #f8fafc;
      background: var(--ink);
      font-size: clamp(.78rem, 1.15vw, .96rem);
      text-align: left;
    }

    .time-head, .time { width: clamp(66px, 7vw, 98px); text-align: center; }

    td {
      position: relative;
      height: 80px;
      padding: 2px;
      vertical-align: top;
      background: #fbfcfe;
    }

    .options-row td { height: 142px; }

    .time {
      padding: 7px 2px;
      color: #56637a;
      background: #f0f3f8;
    }

    .time strong { display: block; color: var(--ink); font-size: clamp(.76rem, 1.25vw, .96rem); }
    .time span { display: block; margin-top: 3px; font-size: .7rem; font-weight: 700; }

    .lesson {
      width: 100%;
      min-height: 75px;
      padding: 5px;
      border: 1px solid rgba(23,35,63,.10);
      border-left: 4px solid var(--color);
      border-radius: 7px;
      color: var(--ink);
      background: var(--tint);
      cursor: pointer;
      text-align: left;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .lesson:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(23,35,63,.12); }
    .name { display: block; overflow-wrap: anywhere; font-size: clamp(.78rem, 1.12vw, 1rem); font-weight: 900; line-height: 1.1; }
    .meta { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }

    .pill {
      display: inline-flex;
      min-height: 18px;
      align-items: center;
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.86);
      font-size: clamp(.64rem, .78vw, .73rem);
      font-weight: 850;
      white-space: nowrap;
    }

    .room { color: #087564; }
    .teacher { color: #985006; }
    .choices { display: grid; gap: 2px; }

    .choice {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 3px;
      align-items: center;
      padding: 3px 4px;
      border-radius: 5px;
      background: rgba(255,255,255,.76);
    }

    .choice-name { overflow: hidden; font-size: clamp(.67rem,.78vw,.76rem); font-weight: 850; line-height: 1.05; text-overflow: ellipsis; white-space: nowrap; }
    .choice-data { color: #526078; font-size: clamp(.6rem,.7vw,.68rem); font-weight: 800; white-space: nowrap; }

    .recess-row td { height: 31px; }
    .recess-cell { padding: 0; background: repeating-linear-gradient(135deg,#eef2ff 0 10px,#f7f8ff 10px 20px); }
    .recess { display: flex; height: 31px; align-items: center; justify-content: center; color: #334a9c; font-size: .7rem; font-weight: 900; letter-spacing: .11em; text-transform: uppercase; }

    .today { box-shadow: inset 0 0 0 2px rgba(49,85,217,.22); }
    thead .today { color: var(--accent); }
    .now { box-shadow: 0 0 0 3px var(--accent), 0 7px 17px rgba(23,35,63,.13); }

    .notice { margin: 3px 2px 0; color: var(--muted); font-size: .68rem; text-align: right; }

    :fullscreen .page { width: calc(100% - 6px); margin: 3px auto; }

    dialog {
      width: min(510px, calc(100% - 26px));
      padding: 25px;
      border: 0;
      border-radius: 19px;
      color: var(--ink);
      box-shadow: 0 28px 80px rgba(15,23,42,.34);
    }

    dialog::backdrop { background: rgba(15,23,42,.6); backdrop-filter: blur(4px); }
    .close { position: absolute; top: 11px; right: 11px; width: 38px; height: 38px; border: 0; border-radius: 50%; color: #47546b; background: #edf0f5; cursor: pointer; font-size: 1.4rem; }
    #dialogTime { margin: 0 42px 5px 0; color: var(--blue); font-size: .76rem; font-weight: 900; text-transform: uppercase; }
    dialog h2 { margin: 0 38px 17px 0; font-size: 1.5rem; }
    .detail { padding: 13px 0; border-top: 1px solid var(--line); }
    .detail:first-child { border-top: 0; }
    .detail h3 { margin: 0 0 7px; font-size: 1rem; }

    .compact .name { font-size: clamp(.78rem,1.2vw,1rem); }

    @media (max-width: 760px) {
      .page { width: calc(100% - 6px); margin: 3px auto; }
      .topbar { align-items: flex-start; }
      .guide-note { display: none; }
      td { padding: 2px; }
      .lesson { padding: 4px 3px; border-left-width: 3px; }
      .choice { grid-template-columns: 1fr; gap: 1px; padding: 4px; }
      .choice-data { white-space: normal; }
    }

    @media (max-width: 560px) {
      .topbar { display: grid; gap: 5px; }
      .actions { width: 100%; }
      .button { flex: 1; min-height: 31px; padding: 0 5px; font-size: .7rem; }
      .button.icon { flex: 0 0 33px; width: 33px; }
      .guide { gap: 7px; min-height: 26px; padding: 2px 5px; font-size: .61rem; }
      thead th { height: 35px; padding: 3px 1px; font-size: .62rem; text-align: center; }
      .time-head, .time { width: 48px; }
      td { height: 72px; }
      .options-row td { height: 147px; }
      .time { padding: 6px 1px; }
      .time strong { font-size: .64rem; }
      .time span { font-size: .56rem; }
      .lesson { min-height: 67px; }
      .name { font-size: .59rem; }
      .meta { display: grid; gap: 1px; margin-top: 2px; }
      .pill { min-height: 17px; padding: 1px 3px; font-size: .49rem; }
      .choice-name { font-size: .52rem; white-space: normal; }
      .choice-data { font-size: .48rem; }
      .notice { text-align: left; }
    }

    @media print {
      @page { size: landscape; margin: 8mm; }
      body { background: white; }
      .page { width: 100%; margin: 0; }
      .actions, .guide, .notice { display: none; }
      .topbar { margin-bottom: 9px; }
      .table-shell { box-shadow: none; }
      td { height: 78px; }
      .options-row td { height: 134px; }
      .lesson { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Curso escolar</p>
        <h1>Horario semanal <span>3.º A</span></h1>
      </div>
      <div class="actions" aria-label="Opciones del horario">
        <button class="button" id="toggle" type="button" aria-pressed="false">Aa · Vista abreviada</button>
        <button class="button icon" id="fullscreen" type="button" title="Pantalla completa" aria-label="Mostrar a pantalla completa">⛶</button>
        <button class="button primary" id="print" type="button">Imprimir</button>
      </div>
    </header>

    <section class="guide" aria-label="Leyenda">
      <span class="key"><span class="dot subject"></span>Materia</span>
      <span class="key"><span class="dot room"></span>Aula</span>
      <span class="key"><span class="dot teacher"></span>Código docente</span>
      <span class="guide-note">Pulsa una clase para ampliar sus datos.</span>
    </section>

    <div class="table-shell">
      <table id="schedule" aria-label="Horario semanal de 3.º A">
        <thead>
          <tr>
            <th class="time-head" scope="col">Hora</th>
            <th scope="col" data-day="1">Lunes</th>
            <th scope="col" data-day="2">Martes</th>
            <th scope="col" data-day="3">Miércoles</th>
            <th scope="col" data-day="4">Jueves</th>
            <th scope="col" data-day="5">Viernes</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>

    <p class="notice">Los códigos permiten identificar al profesorado sin publicar sus nombres.</p>
  </main>

  <dialog id="dialog" aria-labelledby="dialogTitle">
    <button class="close" id="close" type="button" aria-label="Cerrar">×</button>
    <p id="dialogTime"></p>
    <h2 id="dialogTitle">Información de la clase</h2>
    <div id="dialogContent"></div>
  </dialog>

  <script>
    (() => {
      "use strict";

      const subjects = {
        ATEDU: ["Atención Educativa", "ATEDU", "#0f9f8c", "#e9faf7"],
        BIO: ["Biología y Geología", "BIO", "#2f9e44", "#eef9f0"],
        CYR1: ["Computación y Robótica 1", "CyR 1", "#6f42c1", "#f4effc"],
        CYR2: ["Computación y Robótica 2", "CyR 2", "#7b2cbf", "#f5effb"],
        EFI: ["Educación Física", "EFI", "#e8590c", "#fff3eb"],
        EPV: ["Educación Plástica, Visual y Audiovisual", "EPV", "#d63384", "#fff0f7"],
        FRA1: ["Francés 1", "FRA 1", "#1677c8", "#edf7ff"],
        FYQ: ["Física y Química", "FyQ", "#0086a8", "#eaf9fc"],
        GH: ["Geografía e Historia", "GeH", "#9c6b30", "#fbf4eb"],
        ING: ["Inglés", "ING", "#3155d9", "#eef1ff"],
        LCL: ["Lengua Castellana y Literatura", "LCL", "#c92a2a", "#fff0f0"],
        MAT: ["Matemáticas", "MAT", "#5f3dc4", "#f2efff"],
        OYD1: ["Oratoria y Debate 1", "OyD 1", "#ad4e96", "#fff0fb"],
        OYD2: ["Oratoria y Debate 2", "OyD 2", "#9c36b5", "#faeffd"],
        REL: ["Religión", "REL", "#b77900", "#fff7e6"],
        TUT: ["Tutoría", "TUT", "#475569", "#f0f2f5"],
        TYD: ["Tecnología y Digitalización", "TyD", "#0b7285", "#e9f8fa"]
      };

      const lesson = (subject, room, teacher) => [{ subject, room, teacher }];
      const englishTF = [
        { subject: "ING", room: "A15", teacher: "ALVL" },
        { subject: "ING", room: "A12", teacher: "GML" },
        { subject: "ING", room: "A14", teacher: "DHR" },
        { subject: "ING", room: "A16", teacher: "AVT" }
      ];
      const englishTh = [
        { subject: "ING", room: "A15", teacher: "ALVL" },
        { subject: "ING", room: "A12", teacher: "GML" },
        { subject: "ING", room: "A14", teacher: "DHR" },
        { subject: "ING", room: "A17", teacher: "AVT" }
      ];
      const englishW = [
        { subject: "ING", room: "A15", teacher: "ALVL" },
        { subject: "ING", room: "A12", teacher: "GML" },
        { subject: "ING", room: "A14", teacher: "DHR" },
        { subject: "ING", room: "A18", teacher: "AVT" }
      ];
      const electives = [
        { subject: "FRA1", room: "A15", teacher: "SL" },
        { subject: "OYD2", room: "A12", teacher: "TSF" },
        { subject: "OYD1", room: "A14", teacher: "EVR" },
        { subject: "CYR1", room: "TATEC", teacher: "DCP" },
        { subject: "CYR2", room: "A9", teacher: "TSG" }
      ];

      const periods = [
        { start: "08:00", end: "09:00", days: [lesson("FYQ","A15","MCFC"), lesson("BIO","A15","MCL"), lesson("EPV","A15","JJMG"), lesson("LCL","A15","RPB"), lesson("FYQ","A15","MCFC")] },
        { start: "09:00", end: "10:00", days: [lesson("EFI","GIMNASIO","PVM"), englishTF, lesson("EFI","GIMNASIO","PVM"), englishTh, englishTF] },
        { start: "10:00", end: "11:00", days: [lesson("MAT","A15","VMDP"), lesson("FYQ","A15","MCFC"), lesson("MAT","A15","VMDP"), lesson("GH","A15","JAVS"), lesson("TYD","TATEC","DCP")] },
        { start: "11:00", end: "11:30", recess: true },
        { start: "11:30", end: "12:30", options: true, days: [lesson("LCL","A15","RPB"), electives, englishW, lesson("BIO","A15","MCL"), electives] },
        { start: "12:30", end: "13:30", days: [lesson("EPV","A15","JJMG"), lesson("GH","A15","JAVS"), lesson("TYD","TATEC","DCP"), [{subject:"REL",room:"A15",teacher:"MCFR"},{subject:"ATEDU",room:"A17",teacher:"MCL"}], lesson("LCL","A15","RPB")] },
        { start: "13:30", end: "14:30", days: [lesson("GH","A15","JAVS"), lesson("MAT","A15","VMDP"), lesson("LCL","A15","RPB"), lesson("MAT","A15","VMDP"), lesson("TUT","A15","DCP")] }
      ];

      const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
      const body = document.getElementById("body");
      const table = document.getElementById("schedule");
      const toggle = document.getElementById("toggle");
      const dialog = document.getElementById("dialog");
      let compact = false;

      const label = code => compact ? subjects[code][1] : subjects[code][0];
      const time = period => `<th class="time" scope="row"><strong>${period.start}</strong><span>${period.end}</span></th>`;

      function lessonButton(items, day, period) {
        const color = subjects[items[0].subject][2];
        const tint = subjects[items[0].subject][3];
        if (items.length === 1) {
          const item = items[0];
          return `<button class="lesson" type="button" style="--color:${color};--tint:${tint}" data-day="${day}" data-period="${period}">
            <span class="name">${label(item.subject)}</span>
            <span class="meta"><span class="pill room">${item.room}</span><span class="pill teacher">${item.teacher}</span></span>
          </button>`;
        }
        return `<button class="lesson" type="button" style="--color:${color};--tint:${tint}" data-day="${day}" data-period="${period}">
          <span class="choices">${items.map(item => `<span class="choice"><span class="choice-name">${label(item.subject)}</span><span class="choice-data">${item.room} · ${item.teacher}</span></span>`).join("")}</span>
        </button>`;
      }

      function render() {
        body.innerHTML = periods.map((period, periodIndex) => {
          if (period.recess) return `<tr class="recess-row">${time(period)}<td class="recess-cell" colspan="5"><div class="recess">Recreo</div></td></tr>`;
          const cells = period.days.map((items, dayIndex) => `<td data-day="${dayIndex + 1}">${lessonButton(items, dayIndex + 1, periodIndex)}</td>`).join("");
          return `<tr class="${period.options ? "options-row" : ""}">${time(period)}${cells}</tr>`;
        }).join("");
        table.classList.toggle("compact", compact);
        document.querySelectorAll(".lesson").forEach(button => button.addEventListener("click", showDetails));
        highlight();
      }

      function showDetails(event) {
        const button = event.currentTarget;
        const day = Number(button.dataset.day);
        const period = periods[Number(button.dataset.period)];
        const items = period.days[day - 1];
        document.getElementById("dialogTime").textContent = `${days[day - 1]} · ${period.start}–${period.end}`;
        document.getElementById("dialogTitle").textContent = items.length > 1 ? "Grupos y opciones" : subjects[items[0].subject][0];
        document.getElementById("dialogContent").innerHTML = items.map(item => `<article class="detail"><h3>${subjects[item.subject][0]}</h3><div class="meta"><span class="pill room">Aula: ${item.room}</span><span class="pill teacher">Código docente: ${item.teacher}</span></div></article>`).join("");
        if (typeof dialog.showModal === "function") dialog.showModal(); else dialog.setAttribute("open", "");
      }

      const minutes = value => { const [h,m] = value.split(":").map(Number); return h * 60 + m; };

      function highlight() {
        document.querySelectorAll(".today,.now").forEach(element => element.classList.remove("today","now"));
        const date = new Date();
        const today = date.getDay();
        if (today < 1 || today > 5) return;
        document.querySelectorAll(`[data-day="${today}"]`).forEach(element => element.classList.add("today"));
        const current = date.getHours() * 60 + date.getMinutes();
        const active = periods.findIndex(period => !period.recess && current >= minutes(period.start) && current < minutes(period.end));
        if (active >= 0) document.querySelector(`.lesson[data-day="${today}"][data-period="${active}"]`)?.classList.add("now");
      }

      toggle.addEventListener("click", () => {
        compact = !compact;
        toggle.setAttribute("aria-pressed", String(compact));
        toggle.textContent = compact ? "Aa · Nombres completos" : "Aa · Vista abreviada";
        render();
      });
      document.getElementById("print").addEventListener("click", () => window.print());
      document.getElementById("fullscreen").addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch (_) {
          /* Algunos navegadores bloquean el modo completo al abrir archivos locales. */
        }
      });
      document.getElementById("close").addEventListener("click", () => dialog.close ? dialog.close() : dialog.removeAttribute("open"));
      dialog.addEventListener("click", event => { if (event.target === dialog && dialog.close) dialog.close(); });

      render();
      setInterval(highlight, 60000);
    })();
  </script>
</body>
</html>
