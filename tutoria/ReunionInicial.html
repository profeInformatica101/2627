
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Reunión inicial familias - 3.º ESO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .contenedor {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #1e3a8a;
      font-size: 28px;
    }

    .descripcion {
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
    }

    .genially {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 10px;
      background: #0f172a;
    }

    .genially iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .acciones {
      text-align: center;
      margin-top: 22px;
    }

    .boton {
      display: inline-block;
      padding: 13px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .boton:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .contenedor {
        padding: 12px;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <h1>Reunión inicial con las familias</h1>

    <p class="descripcion">
      3.º ESO · Presentación interactiva
    </p>

    <div class="genially">
      <iframe
        src="https://view.genially.com/651edd6c0bcdeb0011fe59a6"
        title="Reunión inicial con las familias"
        loading="lazy"
        allowfullscreen
        allow="fullscreen">
      </iframe>
    </div>

    <div class="acciones">
      <a
        class="boton"
        href="https://view.genially.com/651edd6c0bcdeb0011fe59a6"
        target="_blank"
        rel="noopener noreferrer">
        Abrir Genially en pantalla completa ↗
      </a>
    </div>

    <footer>
      3.º ESO · Curso 2026-2027
    </footer>

  </main>

</body>
</html>
